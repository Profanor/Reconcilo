services:
  # 1. NestJS Reconciliation Backend
  - type: web
    name: reconcilo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run build && npx prisma db push && npm run seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reconcilo-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://reconcilo.vercel.app,https://reconcilo.netlify.app
      - key: DEMO_PILOT_MODE
        value: "true"

  # 2. Vite React Frontend (Static SPA)
  - type: web
    name: reconcilo-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://reconcilo-api.onrender.com/api

databases:
  - name: reconcilo-db
    plan: free
    databaseName: reconcilo
    user: postgres
